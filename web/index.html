<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>UC Berkeley Campus Amenities</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <h1 class="app-title">UC Berkeley Campus Amenities</h1>

      <section id="map" class="map" aria-label="UC Berkeley campus map"></section>

      <nav class="top-actions" aria-label="App actions">
        <button type="button" data-drawer-view="create" aria-controls="drawer">
          Create
        </button>
        <button type="button" data-drawer-view="settings" aria-controls="drawer">
          Settings
        </button>
      </nav>

      <section id="drawer" class="drawer" data-drawer-state="expanded" aria-label="Campus information">
        <header class="drawer-header">
          <button type="button" data-drawer-back data-drawer-view="search" hidden>Back</button>
          <button type="button" data-drawer-toggle aria-label="Collapse drawer">Collapse</button>
        </header>

        <div class="drawer-content">
          <section class="drawer-view" data-view="search">
            <form class="search-form" role="search">
              <div class="search-input-row">
                <input
                  id="amenity-search"
                  name="query"
                  type="search"
                  aria-label="Search by amenity or building"
                  placeholder="Restrooms, water, Doe Library..."
                >
                <button type="submit">Search</button>
              </div>
            </form>

            <hr class="search-divider">

            <section class="amenity-list" aria-label="Campus Amenities" aria-live="polite">
              <div class="amenity-list-title">Campus Amenities</div>
              <p class="amenity-placeholder">Nearby amenities will appear here.</p>
            </section>
          </section>

          <article class="drawer-view" data-view="details" hidden>
            <header class="detail-header">
              <div class="detail-title-row">
                <h2 class="detail-type">Amenity type</h2>
                <span class="availability-badge detail-availability"></span>
              </div>
              <p class="detail-location">Building and floor</p>
            </header>
            <dl class="detail-list">
              <div><dt>Rating</dt><dd class="detail-rating"></dd></div>
              <div><dt>Hours</dt><dd class="detail-hours"></dd></div>
              <div><dt>Accessibility</dt><dd class="detail-accessibility"></dd></div>
              <div><dt>Location details</dt><dd class="detail-location-details"></dd></div>
              <div><dt>Notes</dt><dd class="detail-notes"></dd></div>
            </dl>
            <p class="detail-update">Last reported</p>
          </article>

          <section class="drawer-view" data-view="create" hidden>
            <h2>Add an amenity</h2>
            <p class="form-intro"><span aria-hidden="true">*</span> Required fields</p>
            <form class="amenity-form">
              <label class="form-field" for="amenity-type">
                <span>Amenity type <span aria-hidden="true">*</span></span>
                <select id="amenity-type" name="type" required>
                  <option value="" selected disabled>Select a type</option>
                  <option>Restroom</option>
                  <option>Water refill station</option>
                  <option>Vending machine</option>
                  <option>Study space</option>
                  <option>Food</option>
                  <option>Other</option>
                </select>
              </label>

              <label class="form-field" for="amenity-building">
                <span>Building <span aria-hidden="true">*</span></span>
                <select id="amenity-building" name="building" required>
                  <option value="" selected disabled>Select a building</option>
                  <option>Soda Hall</option>
                  <option>Cory Hall</option>
                  <option>GSPP</option>
                  <option>Sutardja Dai Hall</option>
                </select>
              </label>

              <label class="form-field" for="amenity-floor">
                <span>Floor <span aria-hidden="true">*</span></span>
                <input id="amenity-floor" name="floor" type="number" min="0" max="20" required>
              </label>

              <label class="form-field" for="amenity-location-details">
                <span>Location details</span>
                <input
                  id="amenity-location-details"
                  name="locationDetails"
                  type="text"
                  placeholder="Room, hallway, or nearby landmark"
                >
              </label>

              <label class="form-field" for="amenity-availability">
                <span>Availability <span aria-hidden="true">*</span></span>
                <select id="amenity-availability" name="availability" required>
                  <option value="" selected disabled>Select availability</option>
                  <option>Available</option>
                  <option>Out of service</option>
                  <option>Unknown</option>
                </select>
              </label>

              <label class="form-field" for="amenity-accessibility">
                <span>Accessibility <span aria-hidden="true">*</span></span>
                <select id="amenity-accessibility" name="accessibility" required>
                  <option value="" selected disabled>Select accessibility</option>
                  <option>Accessible</option>
                  <option>Not accessible</option>
                  <option>Unknown</option>
                </select>
              </label>

              <label class="form-field" for="amenity-hours">
                <span>Operating hours</span>
                <input id="amenity-hours" name="hours" type="text" placeholder="For example, 8:00 AM-5:00 PM">
              </label>

              <label class="form-field" for="amenity-rating">
                <span>Rating</span>
                <select id="amenity-rating" name="rating">
                  <option value="" selected>Not rated</option>
                  <option value="1">1 - Poor</option>
                  <option value="2">2</option>
                  <option value="3">3 - Average</option>
                  <option value="4">4</option>
                  <option value="5">5 - Excellent</option>
                </select>
              </label>

              <label class="form-field" for="amenity-notes">
                <span>Notes</span>
                <textarea id="amenity-notes" name="notes" rows="4"></textarea>
              </label>

              <button class="amenity-submit" type="submit">Submit amenity</button>
            </form>
            <p class="form-success" role="status" tabindex="-1" hidden></p>
          </section>

          <section class="drawer-view" data-view="settings" hidden>
            <h2>Settings</h2>
            <p>Map, accessibility, and account settings will appear here.</p>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
